---
# Phase 4: Generate and apply remediations using native Ansible playbooks (no Python scripts)

- name: Apply security hardening
  when: rhel_stig_with_rollback_apply_remediations
  block:
    - name: Check if selective audit is requested
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_selective_mode: >-
          {{
            (stig_audit_mode | default('full') | lower == 'selective') and
            (rhel_stig_with_rollback_stig_rules_to_apply is defined) and
            (rhel_stig_with_rollback_stig_rules_to_apply | string | trim not in ['', '[]', 'none', 'null'])
          }}

    - name: Display remediation mode
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "{% if rhel_stig_with_rollback_selective_mode %}SELECTIVE REMEDIATION (NATIVE ANSIBLE){% else %}FULL REMEDIATION (NATIVE ANSIBLE){% endif %}"
          - "========================================================================="
          - >-
            {{ 'Applying ' ~ (rhel_stig_with_rollback_stig_rules_to_apply | length) ~ ' selected rules'
                if rhel_stig_with_rollback_selective_mode else 'Applying all rules from profile' }}
          - "========================================================================="

    - name: Generate native Ansible remediation playbook from SCAP data stream
      ansible.builtin.command: >
        oscap xccdf generate fix
        --fix-type ansible
        --profile {{ rhel_stig_with_rollback_stig_profile_id }}
        --output "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
        "{{ rhel_stig_with_rollback_scap_ds_path }}"
      register: rhel_stig_with_rollback_generate_fix
      changed_when: true

    - name: Check remediation playbook was created
      ansible.builtin.stat:
        path: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      register: rhel_stig_with_rollback_remediation_playbook_stat

    - name: Fail if remediation playbook is empty or missing
      ansible.builtin.fail:
        msg: "Remediation playbook was not generated or is empty"
      when: >
        not rhel_stig_with_rollback_remediation_playbook_stat.stat.exists or
        rhel_stig_with_rollback_remediation_playbook_stat.stat.size | default(0) < 100

    - name: Build normalized tag list for selective mode
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_ansible_tags: >-
          {%- set tag_list = [] -%}
          {%- for rule in rhel_stig_with_rollback_stig_rules_to_apply | default([]) -%}
            {%- set clean_rule = rule | regex_replace('^xccdf_org\\.ssgproject\\.content_rule_', '') -%}
            {%- set _ = tag_list.append('xccdf_org.ssgproject.content_rule_' ~ clean_rule) -%}
          {%- endfor -%}
          {{ tag_list | join(',') }}
      when: rhel_stig_with_rollback_selective_mode

    - name: Execute generated Ansible remediation playbook (Full Mode)
      ansible.builtin.command: >
        ansible-playbook -i localhost, -c local
        "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      args:
        chdir: "{{ rhel_stig_with_rollback_stig_work_dir }}"
      register: rhel_stig_with_rollback_remediation_result
      failed_when: false
      changed_when: true
      async: 3600
      poll: 10
      environment:
        PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ignore_unreachable: true
      when: not rhel_stig_with_rollback_selective_mode

    - name: Execute generated Ansible remediation playbook (Selective Mode via Tags)
      ansible.builtin.command: >
        ansible-playbook -i localhost, -c local
        --tags "{{ rhel_stig_with_rollback_ansible_tags }}"
        "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      args:
        chdir: "{{ rhel_stig_with_rollback_stig_work_dir }}"
      register: rhel_stig_with_rollback_remediation_result
      failed_when: false
      changed_when: true
      async: 3600
      poll: 10
      environment:
        PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      ignore_unreachable: true
      when:
        - rhel_stig_with_rollback_selective_mode
        - rhel_stig_with_rollback_ansible_tags | length > 0

    - name: Check if system is still reachable after remediation
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
      register: rhel_stig_with_rollback_reconnect_result
      failed_when: false

    - name: Handle potential reboot from remediation
      when: rhel_stig_with_rollback_reconnect_result is failed
      block:
        - name: Wait for system to come back (may have rebooted)
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            delay: 10
            timeout: 600
            state: started
          delegate_to: localhost
          become: false

        - name: Wait for system to be fully ready
          ansible.builtin.wait_for_connection:
            delay: 15
            timeout: 300

        - name: Gather facts after reboot
          ansible.builtin.setup:

    - name: Re-register remediation result if connection lost
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_remediation_result: >-
          {{ rhel_stig_with_rollback_remediation_result | default({'rc': 0, 'stdout': 'Completed - system may have rebooted', 'stderr': ''}) }}
      when: rhel_stig_with_rollback_remediation_result is not defined

    - name: Save remediation log
      ansible.builtin.copy:
        dest: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log"
        content: |
          MODE: {% if rhel_stig_with_rollback_selective_mode %}
          SELECTIVE (Tags: {{ rhel_stig_with_rollback_ansible_tags | default('') }})
          {% else %}FULL{% endif %}

          EXIT CODE: {{ rhel_stig_with_rollback_remediation_result.rc | default(0) }}

          STDOUT:
          {{ rhel_stig_with_rollback_remediation_result.stdout | default('') }}

          STDERR:
          {{ rhel_stig_with_rollback_remediation_result.stderr | default('') }}
        mode: '0644'

    - name: Check remediation exit code
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_remediation_failed: "{{ (rhel_stig_with_rollback_remediation_result.rc | default(0)) not in [0, 2] }}"

    - name: Note remediation issues (not necessarily critical)
      ansible.builtin.debug:
        msg:
          - "⚠️  Remediation playbook exited with code {{ rhel_stig_with_rollback_remediation_result.rc | default(0) }}"
          - "This indicates some rules could not be applied automatically."
          - "Checking if system is still operational..."
      when: rhel_stig_with_rollback_remediation_failed | default(false)

    - name: Set failure details for remediation errors
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_failure_reason: "Remediation playbook failed"
        rhel_stig_with_rollback_failure_exit_code: "{{ rhel_stig_with_rollback_remediation_result.rc | default(1) }}"
        rhel_stig_with_rollback_failure_log_location: >-
          {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log
        rhel_stig_with_rollback_failure_type: "remediation"
      when: rhel_stig_with_rollback_remediation_failed | default(false)

  rescue:
    - name: Capture exception details
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_failure_reason: "Remediation playbook execution error"
        rhel_stig_with_rollback_failure_log_location: >-
          {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log
        rhel_stig_with_rollback_failure_type: "remediation_exception"
        rhel_stig_with_rollback_failure_exit_code: "{{ rhel_stig_with_rollback_remediation_result.rc | default('unknown') }}"

    - name: Note remediation exception
      ansible.builtin.debug:
        msg:
          - "⚠️  Remediation playbook encountered an exception"
          - "The operational check will determine if rollback is needed."
