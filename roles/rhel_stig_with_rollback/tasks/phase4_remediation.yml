---
# Phase 4: Generate and apply STIG remediations (selective or full)

- name: Apply STIG hardening
  when: rhel_stig_with_rollback_apply_remediations
  block:
    - name: Normalize audit mode and selected rules list
      ansible.builtin.set_fact:
        _normalized_rules_list: >-
          {%- set raw = rhel_stig_with_rollback_stig_rules_to_apply | default([]) -%}
          {%- if raw is string -%}
            {{ raw.replace('\n', ',').split(',') | map('trim') | reject('equalto', '') | list }}
          {%- elif raw is iterable -%}
            {{ raw | map('trim') | reject('equalto', '') | list }}
          {%- else -%}
            []
          {%- endif -%}

    - name: Determine effective audit mode
      ansible.builtin.set_fact:
        _effective_audit_mode: >-
          {%- set explicit_mode = stig_audit_mode | default(rhel_stig_with_rollback_stig_audit_mode | default('')) | string | trim | lower -%}
          {%- if explicit_mode in ['selective', 'full'] -%}
            {{ explicit_mode }}
          {%- elif _normalized_rules_list | length > 0 -%}
            selective
          {%- else -%}
            full
          {%- endif -%}

    - name: Check if selective audit is requested
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_selective_mode: >-
          {{
            (_effective_audit_mode == 'selective') and
            (_normalized_rules_list | length > 0)
          }}
        rhel_stig_with_rollback_stig_rules_to_apply: "{{ _normalized_rules_list }}"

    - name: Display remediation mode
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "{% if rhel_stig_with_rollback_selective_mode %}SELECTIVE STIG REMEDIATION{% else %}FULL STIG REMEDIATION{% endif %}"
          - "========================================================================="
          - >-
            {{ 'Applying ' ~ (rhel_stig_with_rollback_stig_rules_to_apply | length) ~ ' selected rules'
                if rhel_stig_with_rollback_selective_mode else 'Applying all STIG rules from profile' }}
          - >-
            {% if rhel_stig_with_rollback_selective_mode -%}
            Selected rules:{% for rule in rhel_stig_with_rollback_stig_rules_to_apply %}  - {{ rule }}{% endfor %}
            {%- endif %}
          - "========================================================================="

    - name: Generate full STIG remediation playbook from SCAP data stream
      ansible.builtin.command: >
        oscap xccdf generate fix
        --fix-type ansible
        --profile {{ rhel_stig_with_rollback_stig_profile_id }}
        --output "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_full_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
        "{{ rhel_stig_with_rollback_scap_ds_path }}"
      register: rhel_stig_with_rollback_generate_fix
      changed_when: true

    - name: Check full remediation playbook was created
      ansible.builtin.stat:
        path: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_full_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      register: rhel_stig_with_rollback_full_playbook_stat

    - name: Fail if full remediation playbook is empty or missing
      ansible.builtin.fail:
        msg: "Full remediation playbook was not generated or is empty"
      when: >
        not rhel_stig_with_rollback_full_playbook_stat.stat.exists or
        rhel_stig_with_rollback_full_playbook_stat.stat.size | default(0) < 100

    - name: Filter remediation playbook for selected rules (selective mode)
      when: rhel_stig_with_rollback_selective_mode
      block:
        - name: Copy Ansible playbook filter script
          ansible.builtin.copy:
            src: filter_ansible_playbook.py
            dest: "{{ rhel_stig_with_rollback_stig_work_dir }}/filter_ansible_playbook.py"
            mode: '0755'

        - name: Create filtered remediation playbook
          ansible.builtin.command: >
            {{ ansible_python_interpreter | default('/usr/libexec/platform-python') }}
            {{ rhel_stig_with_rollback_stig_work_dir }}/filter_ansible_playbook.py
            {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_full_{{ rhel_stig_with_rollback_backup_timestamp }}.yml
            {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml
            {{ rhel_stig_with_rollback_stig_rules_to_apply | join(',') }}
          register: rhel_stig_with_rollback_filter_result
          changed_when: true

        - name: Display filter results
          ansible.builtin.debug:
            msg: "{{ rhel_stig_with_rollback_filter_result.stdout_lines }}"

    - name: Use full remediation playbook (non-selective mode)
      ansible.builtin.copy:
        src: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_full_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
        dest: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
        mode: '0644'
        remote_src: true
      when: not rhel_stig_with_rollback_selective_mode

    - name: Check final remediation playbook was created
      ansible.builtin.stat:
        path: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      register: rhel_stig_with_rollback_remediation_playbook_stat

    - name: Display remediation playbook info
      ansible.builtin.debug:
        msg:
          - "Remediation playbook: {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
          - "Playbook exists: {{ rhel_stig_with_rollback_remediation_playbook_stat.stat.exists }}"
          - "Playbook size: {{ rhel_stig_with_rollback_remediation_playbook_stat.stat.size | default(0) }} bytes"
          - >-
            {% if rhel_stig_with_rollback_selective_mode %}Mode: SELECTIVE
            ({{ rhel_stig_with_rollback_stig_rules_to_apply | length }} rules){% else %}Mode: FULL (all rules){% endif %}

    - name: Fail if remediation playbook is empty or missing
      ansible.builtin.fail:
        msg: "Remediation playbook was not generated or is empty"
      when: >
        not rhel_stig_with_rollback_remediation_playbook_stat.stat.exists or
        rhel_stig_with_rollback_remediation_playbook_stat.stat.size | default(0) < 100

    - name: Execute remediation playbook
      block:
        - name: Include remediation tasks
          ansible.builtin.include_tasks: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml"
      rescue:
        - name: Capture remediation errors
          ansible.builtin.set_fact:
            rhel_stig_with_rollback_remediation_result:
              failed: true
              msg: "{{ ansible_failed_result.msg | default('Remediation playbook encountered errors') }}"
      always:
        - name: Set remediation success if no errors
          ansible.builtin.set_fact:
            rhel_stig_with_rollback_remediation_result:
              failed: false
          when: rhel_stig_with_rollback_remediation_result is not defined

    - name: Check if system is still reachable after remediation
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
      register: rhel_stig_with_rollback_reconnect_result
      failed_when: false

    - name: Handle potential reboot from remediation
      when: rhel_stig_with_rollback_reconnect_result is failed
      block:
        - name: Wait for system to come back (may have rebooted)
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            delay: 10
            timeout: 600
            state: started
          delegate_to: localhost
          become: false

        - name: Wait for system to be fully ready
          ansible.builtin.wait_for_connection:
            delay: 15
            timeout: 300

        - name: Gather facts after reboot
          ansible.builtin.setup:

    - name: Save remediation log
      ansible.builtin.copy:
        dest: "{{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log"
        content: |
          MODE: {% if rhel_stig_with_rollback_selective_mode %}SELECTIVE{% else %}FULL{% endif %}

          {% if rhel_stig_with_rollback_selective_mode %}
          SELECTED RULES ({{ rhel_stig_with_rollback_stig_rules_to_apply | length }}):
          {% for rule in rhel_stig_with_rollback_stig_rules_to_apply %}
            - {{ rule }}
          {% endfor %}
          {% endif %}

          REMEDIATION TYPE: Ansible Playbook
          PLAYBOOK: {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.yml
          STATUS: {% if rhel_stig_with_rollback_remediation_result.failed | default(false) %}FAILED{% else %}COMPLETED{% endif %}

          {% if rhel_stig_with_rollback_remediation_result.failed | default(false) %}
          ERROR: {{ rhel_stig_with_rollback_remediation_result.msg | default('Unknown error') }}
          {% endif %}
        mode: '0644'

    - name: Check remediation status
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_remediation_failed: "{{ rhel_stig_with_rollback_remediation_result.failed | default(false) }}"

    - name: Note remediation issues (not necessarily critical)
      ansible.builtin.debug:
        msg:
          - "⚠️  Remediation playbook encountered errors"
          - "This indicates some STIG rules could not be applied."
          - "This is NORMAL and does NOT mean the system is broken."
          - "Checking if system is still operational..."
      when: rhel_stig_with_rollback_remediation_failed | default(false)

    - name: Set failure details for remediation errors
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_failure_reason: "Remediation playbook failed"
        rhel_stig_with_rollback_failure_exit_code: "playbook_error"
        rhel_stig_with_rollback_failure_log_location: >-
          {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log
        rhel_stig_with_rollback_failure_type: "remediation"
      when: rhel_stig_with_rollback_remediation_failed | default(false)

  rescue:
    - name: Capture exception details
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_failure_reason: "{{ ansible_failed_result.msg | default('Remediation playbook execution error') }}"
        rhel_stig_with_rollback_failure_log_location: >-
          {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log
        rhel_stig_with_rollback_failure_type: "remediation_exception"
        rhel_stig_with_rollback_failure_exit_code: "exception"

    - name: Note remediation exception
      ansible.builtin.debug:
        msg:
          - "⚠️  Remediation failed on task: {{ ansible_failed_task.name | default('unknown') }}"
          - "Error message: {{ ansible_failed_result.msg | default('none') }}"
