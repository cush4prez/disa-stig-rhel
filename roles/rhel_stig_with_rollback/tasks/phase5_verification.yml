---
# Phase 5: Post-hardening operational verification

- name: Verify system is still operational (not checking compliance)
  when: rhel_stig_with_rollback_apply_remediations
  block:
  - name: Run comprehensive operational check
    ansible.builtin.include_tasks: verify_operational.yml

  - name: Display operational verdict
    ansible.builtin.debug:
      msg: |
        =========================================================================
        {% if rhel_stig_with_rollback_system_is_operable %}
        ✅ SYSTEM IS OPERATIONAL

        The system is functional and accessible.
        Any remaining STIG findings are NON-CRITICAL and can be:
          • Addressed manually
          • Documented as exceptions
          • Fixed in a future remediation run

        No rollback needed - hardening will continue.
        {% else %}
        ❌ SYSTEM IS INOPERABLE

        Critical failures detected:
        {% for failure in rhel_stig_with_rollback_operational_failures %}
          • {{ failure }}
        {% endfor %}

        Rollback will be initiated to restore functionality.
        {% endif %}
        =========================================================================

  - name: Decide if rollback is needed based on operability
    when: not rhel_stig_with_rollback_system_is_operable and rhel_stig_with_rollback_auto_rollback_on_failure
    block:
      - name: Set failure details for inoperable system
        ansible.builtin.set_fact:
          rhel_stig_with_rollback_failure_reason: "System is inoperable after STIG hardening"
          rhel_stig_with_rollback_failure_details: "Critical failures: {{ rhel_stig_with_rollback_operational_failures | join(', ') }}"
          rhel_stig_with_rollback_failure_log_location: >-
            {{ rhel_stig_with_rollback_stig_work_dir }}/remediation_{{ rhel_stig_with_rollback_backup_timestamp }}.log
          rhel_stig_with_rollback_failure_type: "system_inoperable"

      - name: Display rollback warning
        ansible.builtin.debug:
          msg: "⚠️  System is inoperable, initiating rollback..."

      - name: Execute emergency rollback
        ansible.builtin.include_tasks: rollback.yml
        vars:
          rollback_reason: "{{ rhel_stig_with_rollback_failure_reason }}"
          rollback_details: "{{ rhel_stig_with_rollback_failure_details }}"

- name: Run post-hardening audit
  ansible.builtin.command: >
    oscap xccdf eval
    --profile {{ rhel_stig_with_rollback_stig_profile_id }}
    --results "{{ rhel_stig_with_rollback_stig_audit_dir }}/post_hardening_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"
    --results-arf "{{ rhel_stig_with_rollback_stig_audit_dir }}/post_hardening_{{ rhel_stig_with_rollback_backup_timestamp }}-arf.xml"
    --report "{{ rhel_stig_with_rollback_stig_audit_dir }}/post_hardening_{{ rhel_stig_with_rollback_backup_timestamp }}.html"
    "{{ rhel_stig_with_rollback_scap_ds_path }}"
  register: rhel_stig_with_rollback_post_scan
  failed_when: false
  changed_when: false
  when: rhel_stig_with_rollback_apply_remediations

- name: Check if post-hardening audit XML exists
  ansible.builtin.stat:
    path: "{{ rhel_stig_with_rollback_stig_audit_dir }}/post_hardening_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"
  register: rhel_stig_with_rollback_post_xml_stat
  when: rhel_stig_with_rollback_apply_remediations

- name: Copy parse script to work directory
  ansible.builtin.copy:
    src: parse_oscap_score.py
    dest: "{{ rhel_stig_with_rollback_stig_work_dir }}/parse_oscap_score.py"
    mode: '0755'
  when: rhel_stig_with_rollback_apply_remediations and rhel_stig_with_rollback_post_xml_stat.stat.exists

- name: Parse post-hardening audit results (native)
  when:
    - rhel_stig_with_rollback_apply_remediations | default(true)
    - rhel_stig_with_rollback_post_xml_stat.stat.exists | default(false)
    - rhel_stig_with_rollback_use_native_parsing | default(true)
  block:
    - name: Parse OSCAP post score
      ansible.builtin.include_tasks: parse_oscap_score.yml
      vars:
        oscap_xml_file: "{{ rhel_stig_with_rollback_stig_audit_dir }}/post_hardening_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"

    - name: Set post score variable
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_post_score:
          stdout: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"

- name: Set default post-hardening score if not already set
  ansible.builtin.set_fact:
    rhel_stig_with_rollback_post_score:
      stdout: '0.0'
  when: rhel_stig_with_rollback_post_score is not defined or 'stdout' not in rhel_stig_with_rollback_post_score
