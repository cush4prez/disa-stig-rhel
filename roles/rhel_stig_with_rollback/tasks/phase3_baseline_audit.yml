---
# Phase 3: Baseline audit (selective or full) - Pure Ansible

- name: Create STIG working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
    owner: root
    group: root
  loop:
    - "{{ rhel_stig_with_rollback_stig_audit_dir }}"
    - "{{ rhel_stig_with_rollback_stig_work_dir }}"

- name: Check if selective audit is requested
  ansible.builtin.set_fact:
    rhel_stig_with_rollback_selective_mode: >-
      {{
        (stig_audit_mode | default('full') | lower == 'selective') and
        (rhel_stig_with_rollback_stig_rules_to_apply is defined) and
        (rhel_stig_with_rollback_stig_rules_to_apply | string | trim not in ['', '[]', 'none', 'null'])
      }}

- name: Display audit mode
  ansible.builtin.debug:
    msg:
      - "========================================================================="
      - >-
        {% if rhel_stig_with_rollback_selective_mode %}SELECTIVE STIG AUDIT
        {% else %}FULL STIG AUDIT{% endif %}
      - "========================================================================="
      - >-
        {% if rhel_stig_with_rollback_selective_mode %}
        Auditing {{ rhel_stig_with_rollback_stig_rules_to_apply | length }} selected rules only
        {% else %}Auditing all STIG rules from profile{% endif %}
      - "========================================================================="

- name: Run baseline STIG audit (full or selective)
  ansible.builtin.command: >
    oscap xccdf eval
    --profile {{ rhel_stig_with_rollback_stig_profile_id }}
    --results "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"
    --results-arf "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}-arf.xml"
    --report "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}.html"
    "{{ rhel_stig_with_rollback_scap_ds_path }}"
  register: rhel_stig_with_rollback_baseline_scan
  failed_when: false
  changed_when: false

- name: Check if baseline audit XML exists
  ansible.builtin.stat:
    path: "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"
  register: rhel_stig_with_rollback_baseline_xml_stat

- name: Parse baseline audit results (native Ansible)
  when: rhel_stig_with_rollback_baseline_xml_stat.stat.exists
  block:
    - name: Parse OSCAP score with native Ansible
      ansible.builtin.include_tasks: parse_oscap_score.yml
      vars:
        oscap_xml_file: "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"

    - name: Set baseline score variable (native)
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_baseline_score:
          stdout: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"
        rhel_stig_with_rollback_baseline_score_val: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"

- name: Set default baseline score if XML not found
  ansible.builtin.set_fact:
    rhel_stig_with_rollback_baseline_score:
      stdout: '0.0'
  when: not rhel_stig_with_rollback_baseline_xml_stat.stat.exists

- name: Filter audit results for selected rules (selective mode - native Ansible)
  when:
    - rhel_stig_with_rollback_selective_mode
    - rhel_stig_with_rollback_baseline_xml_stat.stat.exists
  block:
    - name: Filter audit with native Ansible
      ansible.builtin.include_tasks: filter_audit_results.yml
      vars:
        oscap_xml_file: "{{ rhel_stig_with_rollback_stig_audit_dir }}/baseline_{{ rhel_stig_with_rollback_backup_timestamp }}.xml"
        stig_rules_to_filter: "{{ rhel_stig_with_rollback_stig_rules_to_apply }}"

    - name: Map native results to role variable
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_audit_filter_data: "{{ oscap_filtered_results }}"

    - name: Display filtered audit results
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "SELECTIVE AUDIT RESULTS"
          - "========================================================================="
          - "Selected rules: {{ rhel_stig_with_rollback_stig_rules_to_apply | length }}"
          - "Rules found in audit: {{ rhel_stig_with_rollback_audit_filter_data.found | length }}"
          - "Rules not found: {{ rhel_stig_with_rollback_audit_filter_data.not_found | length }}"
          - ""
          - "RESULTS BREAKDOWN:"
          - "  Pass: {{ rhel_stig_with_rollback_audit_filter_data.pass | length }}"
          - "  Fail: {{ rhel_stig_with_rollback_audit_filter_data.fail | length }}"
          - "  Not Applicable: {{ rhel_stig_with_rollback_audit_filter_data.notapplicable | length }}"
          - "  Not Checked: {{ rhel_stig_with_rollback_audit_filter_data.notchecked | length }}"
          - ""
          - >-
            {% if rhel_stig_with_rollback_audit_filter_data.fail | length > 0 %}
            FAILED RULES (will be remediated):
            {% for rule in rhel_stig_with_rollback_audit_filter_data.fail %}  - {{ rule }}{% endfor %}
            {% else %}✅ All selected rules passed!{% endif %}
          - >-
            {% if rhel_stig_with_rollback_audit_filter_data.not_found | length > 0 %}
            ⚠️  RULES NOT FOUND IN AUDIT:
            {% for rule in rhel_stig_with_rollback_audit_filter_data.not_found %}  - {{ rule }}{% endfor %}{% endif %}
          - "========================================================================="

    - name: Save filtered rules that need remediation
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_rules_to_remediate: "{{ rhel_stig_with_rollback_audit_filter_data.fail }}"

- name: Set rules to remediate (full mode - all rules)
  ansible.builtin.set_fact:
    rhel_stig_with_rollback_rules_to_remediate: []
  when: not rhel_stig_with_rollback_selective_mode

- name: Normalize baseline compliance score value
  ansible.builtin.set_fact:
    rhel_stig_with_rollback_compliance_score_display: >-
      {{
        (rhel_stig_with_rollback_baseline_score.stdout | default(rhel_stig_with_rollback_baseline_score))
        if (rhel_stig_with_rollback_baseline_score is mapping and 'stdout' in rhel_stig_with_rollback_baseline_score)
        else (rhel_stig_with_rollback_oscap_compliance_score | default(rhel_stig_with_rollback_baseline_score | default('0.0')))
      }}

- name: Display baseline compliance score
  ansible.builtin.debug:
    msg:
      - >-
        {% if rhel_stig_with_rollback_selective_mode %}Selected rules compliance
        {% else %}Current STIG compliance{% endif %}: {{ rhel_stig_with_rollback_compliance_score_display | string | trim }}%
      - >-
        {% if rhel_stig_with_rollback_selective_mode %}
        Rules to remediate: {{ rhel_stig_with_rollback_rules_to_remediate | default([]) | length }}{% endif %}
