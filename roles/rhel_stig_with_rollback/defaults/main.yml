---
# rhel_stig_with_rollback role default variables
# All variables prefixed with rhel_stig_with_rollback_ per Ansible best practices

# Tailoring configuration
# Set to organization name to load custom STIG variables from tailoring/<profile>/
# Leave empty or undefined to use default STIG values
rhel_stig_with_rollback_tailoring_profile: ""

# Native Ansible parsing
# Use native Ansible modules instead of Python scripts for XML parsing
# Requires: community.general collection >= 8.0.0 and python3-lxml
# Benefits: Better security, no script distribution, easier maintenance
rhel_stig_with_rollback_use_native_parsing: true

# Auto-detect Python compatibility for native parsing
# If true, automatically falls back to Python scripts if lxml is unavailable
# If false, uses the value of use_native_parsing regardless of dependencies
rhel_stig_with_rollback_auto_detect_python: true

# Auto-install dependencies (python3-lxml) for native parsing
# If true, automatically installs python3-lxml if missing
# If false, only detects and falls back to Python scripts
rhel_stig_with_rollback_auto_install_deps: true

# Backup configuration
rhel_stig_with_rollback_enable_auto_backup: true
rhel_stig_with_rollback_backup_root: "/opt/stig_backups"
rhel_stig_with_rollback_backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
rhel_stig_with_rollback_backup_name: "pre_stig_{{ ansible_hostname }}_{{ rhel_stig_with_rollback_backup_timestamp }}"

# Controller backup configuration (disaster recovery)
rhel_stig_with_rollback_fetch_to_controller: true
rhel_stig_with_rollback_controller_backup_dir: "/var/lib/awx/projects/stig_backups"

# STIG configuration
rhel_stig_with_rollback_scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
rhel_stig_with_rollback_stig_profile_id: "xccdf_org.ssgproject.content_profile_stig"
rhel_stig_with_rollback_stig_audit_dir: "/opt/stig_audit"
rhel_stig_with_rollback_stig_work_dir: "/opt/stig_work"

# Remediation control
rhel_stig_with_rollback_apply_remediations: true
rhel_stig_with_rollback_require_confirmation: true

# Selective STIG application
# Leave empty [] to audit/remediate ALL rules
# Or specify list of rule IDs to audit/remediate only those
# Example: ['sysctl_crypto_fips_enabled', 'audit_rules_login_events']
rhel_stig_with_rollback_stig_rules_to_apply: []

# Selective mode flag (computed from stig_rules_to_apply)
# Set automatically in phase3, but defaulted here for safety
rhel_stig_with_rollback_selective_mode: false

# Rollback configuration
rhel_stig_with_rollback_auto_rollback_on_failure: true
rhel_stig_with_rollback_rollback_on_critical_service_failure: true
rhel_stig_with_rollback_critical_services:
  - sshd
  - NetworkManager
