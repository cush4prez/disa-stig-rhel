# Example inventory for local testing
# For AAP: create inventory through AAP UI instead

[rhel8]
rhel8-base.myhome.lab ansible_host=192.168.1.80
rhel8-disa.myhome.lab ansible_host=192.168.1.81
rhel8-cis.myhome.lab ansible_host=192.168.1.82

[rhel9]
rhel9-base.myhome.lab ansible_host=192.168.1.90
rhel9-disa.myhome.lab ansible_host=192.168.1.91
rhel9-cis.myhome.lab ansible_host=192.168.1.92
[rhel_servers:children]
rhel8
rhel9

[rhel_servers:vars]
ansible_user=cush
ansible_become=true
ansible_become_method=sudo

[rhel8:vars]
ansible_python_interpreter=/usr/bin/python3.9
