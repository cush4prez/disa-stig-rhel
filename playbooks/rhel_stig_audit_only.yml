---
# Audit-Only Playbook (100% Native Ansible - Zero Python Scripts)
- name: RHEL DISA STIG Audit Only (NO REMEDIATIONS)
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Display audit-only notice
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "       RHEL {{ ansible_distribution_major_version }} DISA STIG AUDIT ONLY"
          - "========================================================================="
          - "Target Host        : {{ inventory_hostname }}"
          - "RHEL Version       : {{ ansible_distribution_version }}"
          - "Mode               : AUDIT ONLY - NO CHANGES WILL BE MADE"
          - "========================================================================"

    - name: Verify SCAP content exists
      ansible.builtin.stat:
        path: "{{ scap_ds_path }}"
      register: scap_stat

    - name: Install SCAP content if missing
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present
      when: not scap_stat.stat.exists

    - name: Create STIG audit directory
      ansible.builtin.file:
        path: "{{ stig_audit_dir }}"
        state: directory
        mode: '0750'

    - name: Run STIG audit
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ stig_profile_id }}
        --results {{ stig_audit_dir }}/audit_{{ backup_timestamp }}.xml
        --results-arf {{ stig_audit_dir }}/audit_{{ backup_timestamp }}-arf.xml
        --report {{ stig_audit_dir }}/audit_{{ backup_timestamp }}.html
        {{ scap_ds_path }}
      register: audit_scan
      failed_when: false
      changed_when: false

    - name: Parse audit results with native Ansible
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
      vars:
        oscap_xml_file: "{{ stig_audit_dir }}/audit_{{ backup_timestamp }}.xml"

    - name: Display audit results
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "            RHEL {{ ansible_distribution_major_version }} DISA STIG AUDIT COMPLETE"
          - "========================================================================="
          - "Target Host            : {{ inventory_hostname }}"
          - "RHEL Version           : {{ ansible_distribution_version }}"
          - "STIG Compliance        : {{ rhel_stig_with_rollback_oscap_compliance_score | default('Unknown') }}%"
          - "-------------------------------------------------------------------------"
          - "Audit Report           : {{ stig_audit_dir }}/audit_{{ backup_timestamp }}.html"
          - "Audit Results XML      : {{ stig_audit_dir }}/audit_{{ backup_timestamp }}.xml"
          - "========================================================================"
          - ""
          - "NO CHANGES WERE MADE TO THE SYSTEM"
          - ""
          - "To generate Ansible remediation playbook for review:"
          - '  oscap xccdf generate fix --fix-type ansible \\'
          - '    --profile {{ stig_profile_id }} \\'
          - '    --output /tmp/remediation_review.yml \\'
          - '    {{ scap_ds_path }}'
          - "========================================================================="
