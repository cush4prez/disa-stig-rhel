---
- name: Apply RHEL DISA STIG Hardening with Rollback Protection
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Convert survey inputs to role variables (AAP 2.7)
      ansible.builtin.set_fact:
        rhel_stig_with_rollback_stig_rules_to_apply: >-
          {{ stig_rules_input.split(',') | map('trim') | reject('equalto', '') | list }}
      when:
        - stig_rules_input is defined
        - stig_rules_input | string | trim | length > 0

  roles:
    - rhel_stig_with_rollback
