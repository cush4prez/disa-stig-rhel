---
# Diagnose STIG Remediation Generation (100% Native Ansible Playbook Fix Type)
- name: Diagnose STIG Remediation Issues
  hosts: all
  become: true
  gather_facts: true

  vars:
    test_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    stig_profile_id: "xccdf_org.ssgproject.content_profile_stig"
    scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
    test_dir: "/tmp/stig_diagnostic_{{ test_timestamp }}"

  tasks:
    - name: Check if SCAP content exists
      ansible.builtin.stat:
        path: "{{ scap_ds_path }}"
      register: scap_check

    - name: Create test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: '0750'

    - name: Generate Ansible remediation playbook from data stream
      ansible.builtin.command: >
        oscap xccdf generate fix
        --fix-type ansible
        --profile {{ stig_profile_id }}
        --output "{{ test_dir }}/remediation_from_datastream.yml"
        "{{ scap_ds_path }}"
      register: gen_fix_datastream
      failed_when: false
      changed_when: false

    - name: Check remediation playbook size
      ansible.builtin.stat:
        path: "{{ test_dir }}/remediation_from_datastream.yml"
      register: remediation_check_ds

    - name: Read generated playbook natively to count tasks
      ansible.builtin.slurp:
        src: "{{ test_dir }}/remediation_from_datastream.yml"
      register: diag_playbook_b64
      when: remediation_check_ds.stat.exists

    - name: Display diagnostic summary
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "STIG ANSIBLE REMEDIATION DIAGNOSTIC SUMMARY"
          - "========================================================================="
          - "SCAP Content     : {{ 'FOUND' if scap_check.stat.exists else 'MISSING' }}"
          - "Playbook Created : {{ 'YES' if remediation_check_ds.stat.exists else 'NO' }}"
          - "Playbook Size    : {{ remediation_check_ds.stat.size | default(0) }} bytes"
          - "Extracted Tasks  : {{ ((diag_playbook_b64.content | b64decode | from_yaml)[0].tasks | length) if remediation_check_ds.stat.exists else 0 }}"
          - "Test Directory   : {{ test_dir }}"
          - "========================================================================="
