---
# Test Actual STIG Remediation Execution (100% Native Ansible - Zero Python/Bash Scripts)
- name: Test Actual STIG Remediation Execution
  hosts: all
  become: true
  gather_facts: true

  vars:
    test_dir: "/tmp/stig_remediation_test"
    scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
    stig_profile_id: "xccdf_org.ssgproject.content_profile_stig"

  tasks:
    - name: Create test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: '0750'

    - name: Run BEFORE scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ stig_profile_id }}
        --results "{{ test_dir }}/before.xml"
        --report "{{ test_dir }}/before.html"
        "{{ scap_ds_path }}"
      register: before_scan
      failed_when: false
      changed_when: false

    - name: Get BEFORE score natively
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
      vars:
        oscap_xml_file: "{{ test_dir }}/before.xml"

    - name: Save BEFORE score
      ansible.builtin.set_fact:
        before_score_val: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"

    - name: Display BEFORE score
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "BEFORE REMEDIATION: {{ before_score_val }}% (Exit Code: {{ before_scan.rc }})"
          - "========================================================================="

    - name: Generate Ansible remediation playbook from data stream
      ansible.builtin.command: >
        oscap xccdf generate fix
        --fix-type ansible
        --profile {{ stig_profile_id }}
        --output "{{ test_dir }}/remediation.yml"
        "{{ scap_ds_path }}"
      register: gen_fix
      changed_when: false

    - name: Fetch remediation playbook to controller
      ansible.builtin.fetch:
        src: "{{ test_dir }}/remediation.yml"
        dest: "/tmp/test_remediation_{{ inventory_hostname }}.yml"
        flat: true

    - name: Read remediation playbook on controller
      ansible.builtin.slurp:
        src: "/tmp/test_remediation_{{ inventory_hostname }}.yml"
      delegate_to: localhost
      become: false
      register: _test_pb_b64

    - name: Write executable task list on controller
      ansible.builtin.copy:
        dest: "/tmp/test_remediation_tasks_{{ inventory_hostname }}.yml"
        mode: '0644'
        content: >-
          {%- set play = (_test_pb_b64.content | b64decode | from_yaml)[0] -%}
          {%- set out_tasks = [] -%}
          {%- if play.vars | default({}) | length > 0 -%}
            {%- set _ = out_tasks.append({'name': 'Load OSCAP variables', 'ansible.builtin.set_fact': play.vars}) -%}
          {%- endif -%}
          {%- set _ = out_tasks.extend(play.tasks | default([])) -%}
          {{ out_tasks | to_nice_yaml(indent=2) }}
      delegate_to: localhost
      become: false

    - name: Ask user if they want to run FULL native Ansible remediation
      ansible.builtin.pause:
        prompt: "Continue with FULL native Ansible STIG remediation? (yes/no)"
        echo: true
      register: user_confirm

    - name: Execute FULL native Ansible remediation tasks
      when: user_confirm.user_input | lower == 'yes'
      block:
        - name: Include remediation tasks natively
          ansible.builtin.include_tasks:
            file: "/tmp/test_remediation_tasks_{{ inventory_hostname }}.yml"
            apply:
              ignore_errors: true

        - name: Run AFTER scan
          ansible.builtin.command: >
            oscap xccdf eval
            --profile {{ stig_profile_id }}
            --results "{{ test_dir }}/after.xml"
            --report "{{ test_dir }}/after.html"
            "{{ scap_ds_path }}"
          register: after_scan
          failed_when: false
          changed_when: false

        - name: Get AFTER score natively
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
          vars:
            oscap_xml_file: "{{ test_dir }}/after.xml"

        - name: Display FINAL results
          ansible.builtin.debug:
            msg:
              - "========================================================================="
              - "BEFORE Compliance: {{ before_score_val }}%"
              - "AFTER Compliance:  {{ rhel_stig_with_rollback_oscap_compliance_score }}%"
              - "Improvement:       +{{ ((rhel_stig_with_rollback_oscap_compliance_score | float) - (before_score_val | float)) | round(2) }}%"
              - "========================================================================="
      always:
        - name: Clean up controller temp files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/test_remediation_{{ inventory_hostname }}.yml"
            - "/tmp/test_remediation_tasks_{{ inventory_hostname }}.yml"
          delegate_to: localhost
          become: false
