---
# Comprehensive RHEL DISA STIG Security Audit (100% Native Ansible - Zero Python Scripts)
- name: Comprehensive RHEL DISA STIG Security Audit
  hosts: all
  become: true
  gather_facts: true

  tasks:
    #########################################################################
    # PHASE 1: ENVIRONMENT & ENGINE PREPARATION
    #########################################################################

    - name: Ensure OpenSCAP scanner and native XML dependencies are installed
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
          - python3-lxml
        state: present
        update_cache: false

    - name: Create local STIG audit artifact directory
      ansible.builtin.file:
        path: "{{ stig_audit_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Verify supported RHEL version
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int in [8, 9, 10]
        fail_msg: "This playbook supports RHEL 8, 9, and 10 only. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
        success_msg: "RHEL {{ ansible_distribution_major_version }} detected - proceeding with STIG audit"

    - name: Set clean, predictable audit filenames
      ansible.builtin.set_fact:
        audit_date: "{{ ansible_date_time.date }}"
        results_xml_name: "rhel{{ ansible_distribution_major_version }}_stig_results_{{ inventory_hostname }}_{{ ansible_date_time.date }}.xml"
        report_html_name: "rhel{{ ansible_distribution_major_version }}_stig_results_{{ inventory_hostname }}_{{ ansible_date_time.date }}.html"

    - name: Verify RHEL SCAP Data Stream exists
      ansible.builtin.stat:
        path: "{{ scap_ds_path }}"
      register: ds_stat
      failed_when: not ds_stat.stat.exists

    #########################################################################
    # PHASE 2: EXECUTE DISA STIG AUDIT
    #########################################################################

    - name: Execute full DISA STIG audit (evaluates all controls)
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ stig_profile_id }}
        --results {{ stig_audit_dir }}/{{ results_xml_name }}
        --report {{ stig_audit_dir }}/{{ report_html_name }}
        {{ scap_ds_path }}
      register: oscap_exec
      failed_when: oscap_exec.rc not in [0, 2]
      changed_when: false

    #########################################################################
    # PHASE 3: PARSE XML RESULTS WITH NATIVE ANSIBLE
    #########################################################################

    - name: Parse OSCAP score natively
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
      vars:
        oscap_xml_file: "{{ stig_audit_dir }}/{{ results_xml_name }}"

    - name: Parse OSCAP failures by CAT I/II/III natively
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/rhel_stig_with_rollback/tasks/parse_oscap_failures.yml"
      vars:
        oscap_xml_file: "{{ stig_audit_dir }}/{{ results_xml_name }}"

    - name: Build normalized audit summary fact
      ansible.builtin.set_fact:
        audit_summary:
          score: "{{ rhel_stig_with_rollback_oscap_compliance_score | default('0.0') }}"
          total_rules: "{{ rhel_stig_with_rollback_oscap_checked_rules | default(0) }}"
          pass: "{{ rhel_stig_with_rollback_oscap_pass_count | default(0) }}"
          fail: "{{ rhel_stig_with_rollback_oscap_fail_count | default(0) }}"
          notapplicable: "{{ rhel_stig_with_rollback_oscap_notapplicable_count | default(0) }}"
          cat1_failed: "{{ rhel_stig_with_rollback_oscap_failures.cat1 | default([]) }}"
          cat2_failed: "{{ rhel_stig_with_rollback_oscap_failures.cat2 | default([]) }}"
          cat3_failed: "{{ rhel_stig_with_rollback_oscap_failures.cat3 | default([]) }}"

    #########################################################################
    # PHASE 4: AUDIT REPORTING & DASHBOARDS
    #########################################################################

    - name: Display DISA STIG Executive Overview Dashboard
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "       RHEL {{ ansible_distribution_major_version }} DISA STIG COMPLIANCE AUDIT DASHBOARD"
          - "========================================================================="
          - "Target Host            : {{ inventory_hostname }}"
          - "RHEL Version           : {{ ansible_distribution_version }}"
          - "Audit Date             : {{ audit_date }}"
          - "Benchmark Profile      : DISA STIG (ssg-rhel{{ ansible_distribution_major_version }}-ds.xml)"
          - "Compliance Score       : {{ audit_summary.score }}%"
          - "Checked Controls       : {{ audit_summary.total_rules }}"
          - "Passed Rules           : {{ audit_summary.pass }}"
          - "Failed Rules           : {{ audit_summary.fail }}"
          - "Not Applicable (N/A)   : {{ audit_summary.notapplicable }}"
          - "-------------------------------------------------------------------------"
          - " SEVERITY BREAKDOWN (DOD CATEGORIES):"
          - "  CAT I   (High/Critical) : FAIL: {{ audit_summary.cat1_failed | length }}"
          - "  CAT II  (Medium)        : FAIL: {{ audit_summary.cat2_failed | length }}"
          - "  CAT III (Low)           : FAIL: {{ audit_summary.cat3_failed | length }}"
          - "-------------------------------------------------------------------------"
          - "Artifacts on Target Host:"
          - "  HTML Checklist Report : {{ stig_audit_dir }}/{{ report_html_name }}"
          - "  XML Results           : {{ stig_audit_dir }}/{{ results_xml_name }}"
          - "========================================================================="

    - name: Display Failed CAT I Controls (High Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT I CONTROLS (HIGH SEVERITY) — Total: {{ audit_summary.cat1_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat1_failed | map(attribute='id') | list
               if audit_summary.cat1_failed | length > 0 else ['✓ Zero CAT I failures found!'] }}"

    - name: Display Failed CAT II Controls (Medium Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT II CONTROLS (MEDIUM SEVERITY) — Total: {{ audit_summary.cat2_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat2_failed | map(attribute='id') | list
               if audit_summary.cat2_failed | length > 0 else ['✓ Zero CAT II failures found!'] }}"

    - name: Display Failed CAT III Controls (Low Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT III CONTROLS (LOW SEVERITY) — Total: {{ audit_summary.cat3_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat3_failed | map(attribute='id') | list
               if audit_summary.cat3_failed | length > 0 else ['✓ Zero CAT III failures found!'] }}"
