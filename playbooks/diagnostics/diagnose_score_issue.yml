---
# Diagnostic playbook to verify baseline vs post-hardening scores (100% Native Ansible)
- name: Diagnose STIG Score Issue
  hosts: all
  become: true
  gather_facts: true

  vars:
    stig_work_dir: "/opt/stig_work"
    stig_audit_dir: "/opt/stig_audit"
    stig_profile_id: "xccdf_org.ssgproject.content_profile_stig"
    scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"

  tasks:
    - name: Check latest baseline scan
      ansible.builtin.find:
        paths: "{{ stig_audit_dir }}"
        patterns: "baseline_*.xml"
        excludes: "*-arf.xml"
      register: baseline_scans

    - name: Check latest post-hardening scan
      ansible.builtin.find:
        paths: "{{ stig_audit_dir }}"
        patterns: "post_hardening_*.xml"
        excludes: "*-arf.xml"
      register: post_scans

    - name: Get most recent baseline and post scans
      ansible.builtin.set_fact:
        latest_baseline: "{{ (baseline_scans.files | sort(attribute='mtime') | last).path if baseline_scans.matched > 0 else '' }}"
        latest_post: "{{ (post_scans.files | sort(attribute='mtime') | last).path if post_scans.matched > 0 else '' }}"

    - name: Parse baseline score natively
      when: latest_baseline | length > 0
      block:
        - name: Include native score parser for baseline
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
          vars:
            oscap_xml_file: "{{ latest_baseline }}"
        - name: Save baseline score fact
          ansible.builtin.set_fact:
            diag_baseline_score: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"

    - name: Parse post-hardening score natively
      when: latest_post | length > 0
      block:
        - name: Include native score parser for post-hardening
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
          vars:
            oscap_xml_file: "{{ latest_post }}"
        - name: Save post-hardening score fact
          ansible.builtin.set_fact:
            diag_post_score: "{{ rhel_stig_with_rollback_oscap_compliance_score }}"

    - name: Check latest native Ansible remediation playbook
      ansible.builtin.find:
        paths: "{{ stig_work_dir }}"
        patterns: "remediation_*.yml"
      register: remediation_playbooks

    - name: Get most recent remediation playbook
      ansible.builtin.set_fact:
        latest_remediation: "{{ (remediation_playbooks.files | sort(attribute='mtime') | last).path if remediation_playbooks.matched > 0 else '' }}"

    - name: Get remediation playbook size
      ansible.builtin.stat:
        path: "{{ latest_remediation }}"
      register: remediation_stat
      when: latest_remediation | length > 0

    - name: Test generating a fresh Ansible remediation playbook
      ansible.builtin.command: >
        oscap xccdf generate fix
        --fix-type ansible
        --profile {{ stig_profile_id }}
        --output "{{ stig_work_dir }}/diagnostic_remediation_test.yml"
        "{{ scap_ds_path }}"
      register: test_generate
      changed_when: false

    - name: Check test playbook size
      ansible.builtin.stat:
        path: "{{ stig_work_dir }}/diagnostic_remediation_test.yml"
      register: test_playbook_stat

    - name: Display diagnostic results
      ansible.builtin.debug:
        msg:
          - "========================================================================"
          - "DIAGNOSTIC RESULTS (100% NATIVE ANSIBLE)"
          - "========================================================================"
          - "Baseline File      : {{ latest_baseline | default('NOT FOUND', true) }}"
          - "Baseline Score     : {{ diag_baseline_score | default('N/A') }}%"
          - "Post-Hardening File: {{ latest_post | default('NOT FOUND', true) }}"
          - "Post-Hardening Score: {{ diag_post_score | default('N/A') }}%"
          - "Latest Remediation : {{ latest_remediation | default('NOT FOUND', true) }} ({{ remediation_stat.stat.size | default(0) }} bytes)"
          - "Fresh Playbook Test: {{ test_playbook_stat.stat.size | default(0) }} bytes (rc={{ test_generate.rc }})"
          - "========================================================================"
