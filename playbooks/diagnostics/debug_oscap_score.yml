---
# Debug OSCAP Score Calculation (100% Native Ansible - Zero Python Scripts)
- name: Debug OSCAP Score Calculation
  hosts: all
  become: true
  gather_facts: true

  vars:
    test_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    stig_profile_id: "xccdf_org.ssgproject.content_profile_stig"
    scap_ds_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
    test_dir: "/tmp/oscap_debug_{{ test_timestamp }}"

  tasks:
    - name: Create test directory
      ansible.builtin.file:
        path: "{{ test_dir }}"
        state: directory
        mode: '0750'

    - name: Run OSCAP scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ stig_profile_id }}
        --results "{{ test_dir }}/results.xml"
        --report "{{ test_dir }}/report.html"
        "{{ scap_ds_path }}"
      register: oscap_scan
      failed_when: false
      changed_when: false

    - name: Display scan exit code
      ansible.builtin.debug:
        msg:
          - "OSCAP Exit Code: {{ oscap_scan.rc }}"
          - "  0 = All rules passed (compliant)"
          - "  2 = Some rules failed (non-compliant) - NORMAL"
          - "  1 = Error in scan"

    - name: Parse score using native Ansible task file
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/rhel_stig_with_rollback/tasks/parse_oscap_score.yml"
      vars:
        oscap_xml_file: "{{ test_dir }}/results.xml"

    - name: Extract raw XCCDF <score> elements natively
      community.general.xml:
        path: "{{ test_dir }}/results.xml"
        xpath: "//*[local-name()='score']"
        content: text
      register: raw_xml_scores
      failed_when: false

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "DIAGNOSIS COMPLETE (100% NATIVE ANSIBLE)"
          - "========================================================================="
          - "Native Calculated Compliance : {{ rhel_stig_with_rollback_oscap_compliance_score }}%"
          - >-
            Pass / Fail / Checked        :
            {{ rhel_stig_with_rollback_oscap_pass_count }} /
            {{ rhel_stig_with_rollback_oscap_fail_count }} /
            {{ rhel_stig_with_rollback_oscap_checked_rules }}
          - "Raw XML <score> elements     : {{ raw_xml_scores.matches | default([]) }}"
          - "HTML Report                  : {{ test_dir }}/report.html"
          - "========================================================================="
