---
# Full STIG Workflow Diagnostic (100% Native Ansible Playbook Fix Type)
- name: Full STIG Workflow Diagnostic
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Set SCAP variables (same as role)
      ansible.builtin.set_fact:
        detected_scap_path: "/usr/share/xml/scap/ssg/content/ssg-rhel{{ ansible_distribution_major_version }}-ds.xml"
        detected_profile: "xccdf_org.ssgproject.content_profile_stig"

    - name: Check if SCAP file exists
      ansible.builtin.stat:
        path: "{{ detected_scap_path }}"
      register: scap_file_check

    - name: Check installed SCAP packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Test Ansible remediation playbook generation
      when: scap_file_check.stat.exists
      block:
        - name: Create test directory
          ansible.builtin.file:
            path: /tmp/stig_test
            state: directory
            mode: '0750'

        - name: Generate test Ansible remediation playbook
          ansible.builtin.command: >
            oscap xccdf generate fix
            --fix-type ansible
            --profile {{ detected_profile }}
            --output /tmp/stig_test/test_remediation.yml
            "{{ detected_scap_path }}"
          register: gen_remediation
          failed_when: false
          changed_when: false

        - name: Check generated playbook
          ansible.builtin.stat:
            path: /tmp/stig_test/test_remediation.yml
          register: test_playbook_stat

        - name: Read generated playbook natively
          ansible.builtin.slurp:
            src: /tmp/stig_test/test_remediation.yml
          register: test_playbook_b64
          when: test_playbook_stat.stat.exists

    - name: Final diagnosis summary
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "FINAL DIAGNOSIS SUMMARY (100% NATIVE ANSIBLE)"
          - "========================================================================="
          - "RHEL Version        : {{ ansible_distribution_version }}"
          - "SCAP File           : {{ detected_scap_path }} (Exists: {{ scap_file_check.stat.exists }})"
          - "openscap-scanner    : {{ 'INSTALLED' if 'openscap-scanner' in ansible_facts.packages else 'NOT INSTALLED' }}"
          - "scap-security-guide : {{ 'INSTALLED' if 'scap-security-guide' in ansible_facts.packages else 'NOT INSTALLED' }}"
          - >-
            Ansible Playbook Gen: {{ 'YES' if (test_playbook_stat.stat.exists | default(false))
            and (test_playbook_stat.stat.size | default(0) > 10000) else 'NO' }}
          - "Playbook Size       : {{ test_playbook_stat.stat.size | default(0) }} bytes"
          - >-
            Tasks Count         :
            {{ ((test_playbook_b64.content | b64decode | from_yaml)[0].tasks | length)
            if (test_playbook_stat.stat.exists | default(false)) else 0 }}
          - "========================================================================="
