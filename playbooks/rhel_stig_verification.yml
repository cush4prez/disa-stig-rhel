---
- name: Comprehensive RHEL DISA STIG Security Audit
  hosts: all
  become: true
  gather_facts: true
  tasks:

#########################################################################

# PHASE 1: ENVIRONMENT & ENGINE PREPARATION

#########################################################################

    - name: Ensure OpenSCAP scanner and dependencies are installed
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
          - python3
          - python3-lxml
        state: present
        update_cache: false

    - name: Create local STIG audit artifact directory
      ansible.builtin.file:
        path: "{{ stig_audit_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Verify supported RHEL version
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int in [8, 9, 10]
        fail_msg: "This playbook supports RHEL 8, 9, and 10 only. Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"
        success_msg: "RHEL {{ ansible_distribution_major_version }} detected - proceeding with STIG audit"

    - name: Set clean, predictable audit filenames
      ansible.builtin.set_fact:
        audit_date: "{{ ansible_date_time.date }}"
        results_xml_name: "rhel{{ ansible_distribution_major_version }}_stig_results_{{ inventory_hostname }}{{ ansible_date_time.date }}.xml"
        report_html_name: "rhel{{ ansible_distribution_major_version }}_stig_results{{ inventory_hostname }}{{ ansible_date_time.date }}.html"
        summary_json_name: "rhel{{ ansible_distribution_major_version }}_stig_results{{ inventory_hostname }}_{{ ansible_date_time.date }}.json"

    - name: Verify RHEL SCAP Data Stream exists
      ansible.builtin.stat:
        path: "{{ scap_ds_path }}"
      register: ds_stat
      failed_when: not ds_stat.stat.exists

#########################################################################

# PHASE 2: EXECUTE DISA STIG AUDIT

#########################################################################

    - name: Execute full DISA STIG audit (evaluates all controls)
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ stig_profile_id }}
        --results-arf {{ stig_audit_dir }}/{{ results_xml_name }}
        --report {{ stig_audit_dir }}/{{ report_html_name }}
        {{ scap_ds_path }}
      register: oscap_exec

    # RC 0 = All Pass; RC 2 = Failures Detected (Standard during compliance scans)

      failed_when: oscap_exec.rc not in [0, 2]
      changed_when: false

##########################################################################
# PHASE 3: PARSE XML RESULTS & EXTRACT FAILED CONTROL DETAILS
##########################################################################

    - name: Parse comprehensive rule results and extract failed control details
      ansible.builtin.shell: |
        python3 - << 'EOF'
        import sys
        import os
        import json
        import xml.etree.ElementTree as ET
        results_xml = os.environ.get("RESULTS_XML")
        output_json = os.environ.get("OUTPUT_JSON")

        if not results_xml or not os.path.exists(results_xml):
          sys.stderr.write(f"CRITICAL ERROR: Results file not found at: '{results_xml}'\n")
          sys.exit(1)

        try:
          tree = ET.parse(results_xml)
          root = tree.getroot()
        except Exception as e:
          sys.stderr.write(f"CRITICAL ERROR: Failed to parse XML file '{results_xml}': {e}\n")
          sys.exit(1)

        ns = {
          'xccdf': 'http://checklists.nist.gov/xccdf/1.2',
          'arf': 'http://scap.nist.gov/schema/asset-reporting-format/1.1'
        }
        # Pre-build lookup table for Rule metadata (STIG ID, Title)
        rule_meta = {}
        for rule in root.findall('.//xccdf:Rule', ns):
          rid = rule.get('id')
          if not rid:
            continue

          title_elem = rule.find('xccdf:title', ns)
          title_text = title_elem.text.strip() if title_elem is not None and title_elem.text else ""

          disa_id = ""
          for ident in rule.findall('xccdf:ident', ns):
            ident_system = ident.get('system', '').lower()
            if 'stig' in ident_system or 'disa' in ident_system:
              disa_id = ident.text.strip() if ident.text else ""
              break
            elif not disa_id and ident.text:
              disa_id = ident.text.strip()

          rule_meta[rid] = {
            "title": title_text,
            "disa_id": disa_id
        }

        summary = {
            "total_rules": 0,
            "pass": 0,
            "fail": 0,
            "notapplicable": 0,
            "error": 0,
            "score": 0.0,
            "cat1_failed": [],
            "cat2_failed": [],
            "cat3_failed": [],
            "cat_counts": {
                "cat1": {"pass": 0, "fail": 0},
                "cat2": {"pass": 0, "fail": 0},
                "cat3": {"pass": 0, "fail": 0}
            }
        }

        score_elem = root.find('.//xccdf:score', ns)
        if score_elem is not None and score_elem.text:
          try:
            summary["score"] = round(float(score_elem.text), 2)
          except ValueError:
            pass

        for rule_result in root.findall('.//xccdf:rule-result', ns):
            summary["total_rules"] += 1
            rule_id = rule_result.get('idref', '')
            severity = rule_result.get('severity', 'medium').lower()
            res_elem = rule_result.find('xccdf:result', ns)
            result = res_elem.text if res_elem is not None else 'unknown'

            cat = "cat2"
            if severity == "high":
                cat = "cat1"
            elif severity == "low":
                cat = "cat3"

            if result == 'pass':
                summary["pass"] += 1
                summary["cat_counts"][cat]["pass"] += 1
            elif result == 'fail':
                summary["fail"] += 1
                summary["cat_counts"][cat]["fail"] += 1

                clean_rule_name = rule_id.replace("xccdf_org.ssgproject.content_rule_", "")
                meta = rule_meta.get(rule_id, {})
                title = meta.get("title", "")
                disa_id = meta.get("disa_id", "")

                if disa_id and title:
                    display_str = f"[{disa_id}] {clean_rule_name} — {title}"
                elif title:
                    display_str = f"{clean_rule_name} — {title}"
                else:
                    display_str = clean_rule_name

                finding_info = {
                    "rule": clean_rule_name,
                    "disa_id": disa_id,
                    "title": title,
                    "severity": severity.upper(),
                    "display": display_str
                }

                if cat == "cat1":
                    summary["cat1_failed"].append(finding_info)
                elif cat == "cat2":
                    summary["cat2_failed"].append(finding_info)
                elif cat == "cat3":
                    summary["cat3_failed"].append(finding_info)
            elif result == 'notapplicable':
                summary["notapplicable"] += 1
            else:
                summary["error"] += 1

        with open(output_json, 'w') as f:
          json.dump(summary, f, indent=2)
        EOF
      environment:
        RESULTS_XML: "{{ stig_audit_dir }}/{{ results_xml_name }}"
        OUTPUT_JSON: "{{ stig_audit_dir }}/{{ summary_json_name }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Slurp parsed audit results
      ansible.builtin.slurp:
        src: "{{ stig_audit_dir }}/{{ summary_json_name }}"
      register: slurped_summary

    - name: Set audit facts from parsed data
      ansible.builtin.set_fact:
        audit_summary: "{{ slurped_summary.content | b64decode | from_json }}"

##########################################################################
# PHASE 4: AUDIT REPORTING & DASHBOARDS
##########################################################################

    - name: Display DISA STIG Executive Overview Dashboard
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - "       RHEL {{ ansible_distribution_major_version }} DISA STIG 100% COMPLIANCE AUDIT DASHBOARD"
          - "========================================================================="
          - "Target Host            : {{ inventory_hostname }}"
          - "RHEL Version           : {{ ansible_distribution_version }}"
          - "Audit Date             : {{ audit_date }}"
          - "Benchmark Profile      : DISA STIG (ssg-rhel{{ ansible_distribution_major_version }}-ds.xml)"
          - "Compliance Score       : {{ audit_summary.score }}%"
          - "Total Controls Evaluated: {{ audit_summary.total_rules }}"
          - "Passed Rules           : {{ audit_summary.pass }}"
          - "Failed Rules           : {{ audit_summary.fail }}"
          - "Not Applicable (N/A)   : {{ audit_summary.notapplicable }}"
          - "-------------------------------------------------------------------------"
          - " SEVERITY BREAKDOWN (DOD CATEGORIES):"
          - "  CAT I   (High/Critical) : PASS: {{ audit_summary.cat_counts.cat1.pass }} | FAIL: {{ audit_summary.cat_counts.cat1.fail }}"
          - "  CAT II  (Medium)        : PASS: {{ audit_summary.cat_counts.cat2.pass }} | FAIL: {{ audit_summary.cat_counts.cat2.fail }}"
          - "  CAT III (Low)           : PASS: {{ audit_summary.cat_counts.cat3.pass }} | FAIL: {{ audit_summary.cat_counts.cat3.fail }}"
          - "-------------------------------------------------------------------------"
          - "Artifacts on Target Host:"
          - "  HTML Checklist Report : {{ stig_audit_dir }}/{{ report_html_name }}"
          - "  ARF XML Results       : {{ stig_audit_dir }}/{{ results_xml_name }}"
          - "========================================================================="

    - name: Display Failed CAT I Controls (High Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT I CONTROLS (HIGH SEVERITY) — Total: {{ audit_summary.cat1_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat1_failed | map(attribute='display') | list
               if audit_summary.cat1_failed | length > 0 else ['✓ Zero CAT I failures found!'] }}"

    - name: Display Failed CAT II Controls (Medium Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT II CONTROLS (MEDIUM SEVERITY) — Total: {{ audit_summary.cat2_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat2_failed | map(attribute='display') | list
               if audit_summary.cat2_failed | length > 0 else ['✓ Zero CAT II failures found!'] }}"

    - name: Display Failed CAT III Controls (Low Severity)
      ansible.builtin.debug:
        msg:
          - "========================================================================="
          - " FAILED CAT III CONTROLS (LOW SEVERITY) — Total: {{ audit_summary.cat3_failed | length }}"
          - "========================================================================="
          - "{{ audit_summary.cat3_failed | map(attribute='display') | list if audit_summary.cat3_failed
           | length > 0 else ['✓ Zero CAT III failures found!'] }}"

