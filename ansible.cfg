[defaults]
# Suppress deprecation warning for INJECT_FACTS_AS_VARS
# This setting maintains current behavior (facts available as top-level variables)
# until we migrate to ansible_facts['var'] syntax in Ansible 2.24+
inject_facts_as_vars = True

# Roles path - project roles directory
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

# Other useful settings
# host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Callback plugins for better output
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks, timer

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
